name: Offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev,analysis]'
      - name: Verify authoritative specification
        run: python scripts/check_spec_hash.py
      - name: Lint maintained package and tests
        run: ruff check src scripts tests
      - name: Parse recovered Stage-0 scripts
        run: python -m compileall -q -f stage0 src scripts
      - name: Run offline tests
        run: pytest -m 'not live'
